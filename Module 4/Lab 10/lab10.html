<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fake Webstore</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.1/dist/echarts.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  <style>
      body {
        background-color: #f8f9fa;
      }
      .product-card {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      .card-img-top {
        height: 200px;
        object-fit: contain;
        background-color: white;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <h1 class="text-center mb-4">Seb's Fake Webstore</h1>

      <!-- Product grid -->
      <div id="storeArrayList" class="row g-4"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
      fetch("https://fakestoreapi.com/products")
        .then((response) => response.json())
        .then((products) => {
          const container = document.getElementById("storeArrayList");

          products.forEach((item) => {
            // Create Bootstrap card for each product
            const card = document.createElement("div");
            card.className = "col-sm-6 col-md-4 col-lg-3";

            card.innerHTML = `
              <div class="card product-card h-100">
                <img src="${item.image}" class="card-img-top" alt="${item.title}">
                <div class="card-body d-flex flex-column">
                  <h6 class="card-title">${item.title}</h6>
                  <p class="text-muted mb-1">${item.category}</p>
                  <p class="card-text small flex-grow-1">${item.description.substring(0, 80)}...</p>
                  <div class="d-flex justify-content-between align-items-center mt-2">
                    <span class="fw-bold">$${item.price}</span>
                    <button class="btn btn-sm btn-primary">Add to cart</button>
                  </div>
                </div>
              </div>
            `;

            container.appendChild(card);
          });
        })
        .catch((error) => console.error("Error fetching data:", error));
    </script>
  </body>
</html>
