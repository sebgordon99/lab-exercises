<html lang="en">
  <head>
    <title>Calculator Example</title>
  </head>
  <body>
    <!--submission form for numbers-->
    <form>
      <label for="numb1">Number 1:</label><br />
      <input type="text" id="numb1" name="numb1" /><br />
      <label for="numb2">Number 2:</label><br />
      <input type="text" id="numb2" name="numb2" /><br /><br />
      <button value="Add" onclick="calculate('add')">Add</button>
      <button value="Subtract" onclick="calculate('subtract')">Subtract</button>
      <button value="Multiply" onclick="calculate('multiply')">Multiply</button>
      <button value="Divide" onclick="calculate('divide')">Divide</button>
      <input type="reset" value="Reset" />
    </form>

    <div>
      Result:
      <span id="result"></span>
    </div>
  </body>
  <script>
    
function calculate(operation){
    // let v = document.getElementsByClassName("calcButton").value;
    // console.log(v);
    event.preventDefault();
    const num1 = parseFloat(document.getElementById("numb1").value);
    const num2 = parseFloat(document.getElementById("numb2").value);
    console.log(num1, num2)
    fetch(`http://localhost:3003/calculator/${operation}?num1=${num1}&num2=${num2}`)


      .then((response) => response.json())
      .then((data) => {
        document.getElementById("result").innerHTML = data.result;

      });

    }
  </script>
</html>
